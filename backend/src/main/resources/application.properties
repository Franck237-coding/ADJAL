spring.application.name=adjal-spring-api
server.port=${SERVER_PORT:8099}
server.address=0.0.0.0
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/adjal_vf?zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# Identifiants SMTP lus dans backend/smtp.properties (non versionne) ou dans les variables d'environnement
spring.config.import=optional:file:./smtp.properties
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.api-docs.path=/v3/api-docs

adjal.app-url=${ADJAL_APP_URL:http://localhost:8099}
adjal.session-ttl-days=30
adjal.reset-ttl-minutes=15
adjal.email.from=${MAIL_FROM:${SMTP_USER:no-reply@adjal.cm}}
adjal.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@adjal.cm}
adjal.initial-admin.password=${INITIAL_ADMIN_PASSWORD:admin123}
adjal.initial-admin.name=${INITIAL_ADMIN_NAME:A DJAL Administrateur}
adjal.initial-admin.phone=${INITIAL_ADMIN_PHONE:+237690000000}
adjal.initial-admin.city=${INITIAL_ADMIN_CITY:Yaoundé}

logging.level.cm.adjal=INFO
logging.level.org.flywaydb=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Envoi d'images (categories, produits, avatars) : MediaController accepte jusqu'a 10 Mo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
